name: Build and Push Docker Images

on:
  release:
    types: [published]
  push:
    tags: [v*]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The push-tags trigger above is already scoped to "v*", which never
    # matches an "elevator-v*" CLI release tag. The release:published
    # trigger has no such filter, though -- it fires for ANY release this
    # repo publishes, including the CLI's, whether that's goreleaser
    # creating it directly or cli-release.yml's publication-state job
    # un-drafting/promoting it later. Without this guard, every CLI release
    # would also rebuild and push these three Lambda images to ECR, tagged
    # with a meaningless "requester-elevator-vX.Y.Z"-style tag.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'elevator-')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: eu-central-1
    
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short SHA
        id: get_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get tag name or SHA
        id: get_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "GIT_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
          else
            echo "GIT_TAG=${{ env.SHORT_SHA }}" >> $GITHUB_ENV
          fi
    
      - name: Build and push requester image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/docker/Dockerfile.requester
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/aws-sso-elevator:requester-${{ env.GIT_TAG }}
          provenance: false

      - name: Build and push revoker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/docker/Dockerfile.revoker
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/aws-sso-elevator:revoker-${{ env.GIT_TAG }}
          provenance: false

      - name: Build and push attribute syncer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/docker/Dockerfile.attribute_syncer
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/aws-sso-elevator:attribute-syncer-${{ env.GIT_TAG }}
          provenance: false
