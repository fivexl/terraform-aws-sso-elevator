name: Build and Push Docker Images

on:
  # Release tags are dispatched by cli-release.yml only after signed binary
  # and Homebrew smoke tests pass. Running this workflow does not hold up the
  # GitHub release itself.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to a PR supersedes the previous build; main and release runs each
# get a unique group so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Fork and Dependabot PRs get no Actions secrets, so they could not push anyway.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the PR head, not the merge commit, so the image matches its tag.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Get short SHA
        id: get_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Get tag name or SHA
        id: get_tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # The ECR repo has immutable tags; each PR push has a new head sha.
            echo "GIT_TAG=pr-${PR_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "GIT_TAG=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            # Only the latest main is kept: `*-main` is the repo's one mutable tag,
            # so testers track it without per-commit images piling up.
            echo "GIT_TAG=main" >> "$GITHUB_ENV"
          else
            echo "GIT_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Build and push requester image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/docker/Dockerfile.requester
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/aws-sso-elevator:requester-${{ env.GIT_TAG }}
          provenance: false

      - name: Build and push revoker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/docker/Dockerfile.revoker
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/aws-sso-elevator:revoker-${{ env.GIT_TAG }}
          provenance: false

      - name: Build and push attribute syncer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/docker/Dockerfile.attribute_syncer
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/aws-sso-elevator:attribute-syncer-${{ env.GIT_TAG }}
          provenance: false

      - name: Summarize PR image tag
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Lambda images for this PR"
            echo
            echo "To test this PR, set in the module:"
            echo
            echo '```hcl'
            echo "ecr_repo_tag = \"${GIT_TAG}\""
            echo '```'
            echo
            echo "PR images expire automatically after a retention period."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize main image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "### Lambda images for main"
            echo
            echo "To test the latest merge to main, set in the module:"
            echo
            echo '```hcl'
            echo 'ecr_repo_tag = "main"'
            echo '```'
            echo
            echo "The tag moves with every merge; superseded images expire automatically."
          } >> "$GITHUB_STEP_SUMMARY"
