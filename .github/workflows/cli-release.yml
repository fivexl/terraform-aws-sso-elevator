name: CLI Release

on:
  push:
    # GitHub tag filters are globs, so validate the exact stable SemVer shape
    # before any release work starts.
    tags: ["*.*.*"]

permissions: {}

# Every release writes the same Homebrew cask. Queue tags instead of allowing
# one failed run to roll back another run's cask update.
concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Signing preflight
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' <<<"$TAG"; then
            echo "::error::Release tags must be stable bare SemVer (for example, 4.4.3): $TAG"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to $GITHUB_SHA, which is not reachable from main"
            exit 1
          fi

      - name: Refuse to replace a completed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease 2>/tmp/release-view-error); then
            if [ "$state" = false ]; then
              echo "::error::$TAG is already a completed release; publish fixes under a new patch tag"
              exit 1
            fi
          elif ! grep -q 'HTTP 404' /tmp/release-view-error; then
            cat /tmp/release-view-error >&2
            exit 1
          fi

      - name: Require release secrets
        shell: bash
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in APP_ID APP_PRIVATE_KEY MACOS_SIGN_P12 MACOS_SIGN_PASSWORD \
                      MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Release secrets are missing: ${missing[*]}"
            exit 1
          fi

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fivexl
          repositories: homebrew-tap

      - name: Verify Homebrew tap access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/fivexl/homebrew-tap --jq .full_name

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cmd/elevator/go.mod

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: "v1.51.1"

      - name: Prepare non-publishing release notes
        run: echo "Signing preflight only" > "$RUNNER_TEMP/preflight-release-notes.md"

      # Exercise the real signing and Apple notarization path, but stop before
      # creating a GitHub release or updating Homebrew. This catches pending
      # Apple agreements as well as bad certificates and API credentials.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.18.1"
          args: release --clean --skip=publish,announce --release-notes ${{ runner.temp }}/preflight-release-notes.md --config cmd/elevator/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Verify both macOS signatures
        run: |
          set -euo pipefail
          requirement='=anchor apple generic and certificate leaf[subject.OU] = T962D4K3Y7'
          found=0
          for binary in dist/*_darwin_*/elevator; do
            [ -f "$binary" ] || continue
            found=$((found + 1))
            codesign --verify --strict --verbose=2 "$binary"
            codesign --verify -R "$requirement" "$binary"
            codesign -dv "$binary" 2>&1 | grep -E 'TeamIdentifier|Authority'
          done
          if [ "$found" -ne 2 ]; then
            echo "::error::Expected two signed Darwin binaries, found $found"
            exit 1
          fi

      - name: Explain Apple agreement failures
        if: failure()
        run: |
          {
            echo "### Signing preflight failed"
            echo
            echo "Nothing was published. If the log contains \`FORBIDDEN.REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED\`, the Apple Account Holder must accept the pending agreement in App Store Connect before retrying."
          } >> "$GITHUB_STEP_SUMMARY"

  repository-ci:
    name: Repository CI
    needs: preflight
    uses: ./.github/workflows/base.yml

  cli-ci:
    name: Elevator CI
    needs: preflight
    uses: ./.github/workflows/cli-ci.yml

  publish:
    name: Publish signed release
    needs: [preflight, repository-ci, cli-ci]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tap-branch: ${{ steps.tap-before.outputs.branch }}
      tap-sha-before: ${{ steps.tap-before.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fivexl
          repositories: homebrew-tap

      - name: Record Homebrew tap state
        id: tap-before
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch=$(gh api repos/fivexl/homebrew-tap --jq .default_branch)
          sha=$(gh api "repos/fivexl/homebrew-tap/commits/$branch" --jq .sha)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cmd/elevator/go.mod

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: "v1.51.1"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.18.1"
          args: release --clean --config cmd/elevator/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/*.sbom.json

  smoke:
    name: Smoke (${{ matrix.os }}, ${{ matrix.checkout }})
    needs: publish
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        checkout: [pinned-tag, documented-oneliner]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.checkout == 'pinned-tag' && format('refs/tags/{0}', github.ref_name) || 'main' }}
          persist-credentials: false

      - name: Install the release and run it
        env:
          ELEVATOR_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: sh install.sh

  homebrew-smoke:
    name: Homebrew smoke
    needs: publish
    runs-on: macos-latest
    steps:
      - name: Install the published cask and run it
        run: |
          set -euo pipefail
          brew tap fivexl/homebrew-tap
          brew install --cask fivexl/homebrew-tap/elevator
          "$(brew --prefix)/bin/elevator" version
          codesign --verify --strict --verbose=2 "$(brew --prefix)/bin/elevator"
          codesign --verify -R '=anchor apple generic and certificate leaf[subject.OU] = T962D4K3Y7' "$(brew --prefix)/bin/elevator"

  publication-state:
    name: Finalize release
    needs: [publish, smoke, homebrew-smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        if: needs.smoke.result != 'success' || needs.homebrew-smoke.result != 'success'
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fivexl
          repositories: homebrew-tap

      - name: Restore the previous cask after failed smoke
        if: needs.publish.outputs.tap-sha-before != '' && (needs.smoke.result != 'success' || needs.homebrew-smoke.result != 'success')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
          TAP_BRANCH: ${{ needs.publish.outputs.tap-branch }}
          TAP_SHA_BEFORE: ${{ needs.publish.outputs.tap-sha-before }}
        run: |
          set -euo pipefail
          path=Casks/elevator.rb
          tap_tip=$(gh api "repos/fivexl/homebrew-tap/commits/$TAP_BRANCH" --jq .sha)
          if [ "$tap_tip" = "$TAP_SHA_BEFORE" ]; then
            echo "Homebrew tap was not changed; nothing to restore"
            exit 0
          fi
          if encoded=$(gh api "repos/fivexl/homebrew-tap/contents/$path?ref=$TAP_BRANCH" --jq .content 2>/tmp/tap-current-error); then
            current=$(printf '%s' "$encoded" | base64 --decode)
          elif grep -q 'HTTP 404' /tmp/tap-current-error; then
            echo "$path does not exist; nothing to restore"
            exit 0
          else
            cat /tmp/tap-current-error >&2
            exit 1
          fi
          if ! grep -Fq "/releases/download/$TAG/" <<<"$current"; then
            echo "::error::$path no longer points to $TAG; refusing to overwrite a newer or unrelated cask"
            exit 1
          fi
          current_sha=$(gh api "repos/fivexl/homebrew-tap/contents/$path?ref=$TAP_BRANCH" --jq .sha)
          if before=$(gh api "repos/fivexl/homebrew-tap/contents/$path?ref=$TAP_SHA_BEFORE" --jq .content 2>/tmp/tap-before-error); then
            gh api --method PUT "repos/fivexl/homebrew-tap/contents/$path" \
              -f message="Revert $path: $TAG failed smoke" \
              -f content="$before" \
              -f sha="$current_sha" \
              -f branch="$TAP_BRANCH" >/dev/null
          elif grep -q 'HTTP 404' /tmp/tap-before-error; then
            gh api --method DELETE "repos/fivexl/homebrew-tap/contents/$path" \
              -f message="Revert $path: $TAG failed smoke" \
              -f sha="$current_sha" \
              -f branch="$TAP_BRANCH" >/dev/null
          else
            echo "::error::Could not read the pre-release cask state"
            cat /tmp/tap-before-error
            exit 1
          fi

      - name: Promote or withhold the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PUBLISHED: ${{ needs.publish.result }}
          SMOKED: ${{ needs.smoke.result }}
          HOMEBREW_SMOKED: ${{ needs.homebrew-smoke.result }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED" = success ] && [ "$SMOKED" = success ] && [ "$HOMEBREW_SMOKED" = success ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest
            gh workflow run build_docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
            echo "### $TAG published" >> "$GITHUB_STEP_SUMMARY"
            echo "Signed binaries and Homebrew passed smoke tests; Docker publishing was dispatched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
          fi
          echo "::error::$TAG was withheld (publish=$PUBLISHED smoke=$SMOKED homebrew=$HOMEBREW_SMOKED)"
          exit 1
