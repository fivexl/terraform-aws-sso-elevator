name: 'base'

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-job:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install pre-commit
        run: pip3 install pre-commit

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.2"

      - name: Install tflint
        # The previous install_linux.sh convenience script this step used to
        # curl-pipe-to-bash no longer exists in the tflint repo at all (404
        # on both its master and main branches, confirmed live) -- upstream
        # removed it in favor of downloading and verifying the release
        # archive directly, per tflint's own current README. That 404
        # response, piped into bash, is what broke this job (exit 127: bash
        # tried to run GitHub's 404 page text as a script) -- this wasn't
        # something any change in this PR caused, and broke identically on
        # a clean re-run.
        #
        # Pinned to an exact version with a checksum check, not just a
        # direct download, matching this workflow's checksum-free
        # terraform-docs install below only in spirit -- consistent with
        # this repo's C2 SHA/version-pinning convention elsewhere (see
        # cli-release.yml's syft-version and GoReleaser version pins).
        env:
          TFLINT_VERSION: v0.64.0
          TFLINT_ZIP_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_ZIP_SHA256}  tflint_linux_amd64.zip" | sha256sum -c -
          unzip -q tflint_linux_amd64.zip
          sudo install -c -v tflint /usr/local/bin/
          rm -f tflint_linux_amd64.zip tflint

      - name: Install terraform-docs
        run: |
          curl -Lo /tmp/terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.22.0/terraform-docs-v0.22.0-linux-amd64.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp
          sudo mv /tmp/terraform-docs /usr/local/bin/

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Run tests
        run: bash run-tests.sh

      - name: Show uncommitted changes
        if: always()
        run: |
          echo "=== Git Status ==="
          git status
          echo "=== Git Diff ==="
          git diff

