name: CLI CI

on:
  push:
    branches: [main]
    paths: ["cmd/elevator/**"]
  pull_request:
    paths: ["cmd/elevator/**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/elevator/go.mod
      - name: Check go.mod is tidy
        working-directory: cmd/elevator
        run: go mod tidy -diff
      - name: Vet
        working-directory: cmd/elevator
        run: go vet ./...
      - name: Build
        working-directory: cmd/elevator
        run: go build ./...
      - name: Test
        working-directory: cmd/elevator
        run: go test ./...
