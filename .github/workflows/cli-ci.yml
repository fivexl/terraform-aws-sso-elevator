name: CLI CI

on:
  push:
    branches: [main]
    paths: ["cmd/elevator/**", "install.sh"]
  pull_request:
    paths: ["cmd/elevator/**", "install.sh"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cmd/elevator/go.mod
      - name: Check go.mod is tidy
        working-directory: cmd/elevator
        run: go mod tidy -diff
      - name: Vet
        working-directory: cmd/elevator
        run: go vet ./...
      - name: Build
        working-directory: cmd/elevator
        run: go build ./...
      - name: Test
        working-directory: cmd/elevator
        # -race, not a plain `go test ./...` (#194 test gap): CGO_ENABLED=1
        # is the GitHub-hosted runner default and both matrix OSes ship a C
        # toolchain, so this needs no extra setup here -- previously
        # untested despite request_test.go itself reasoning explicitly
        # about what -race would report on its concurrent-retry paths.
        run: go test -race ./...
      # Both GitHub-hosted runner images used above ship shellcheck
      # preinstalled -- only needs running once, not once per OS in the
      # matrix, since its output doesn't depend on the runner OS.
      - name: Shellcheck install.sh
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck install.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cmd/elevator/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: cmd/elevator

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          work-dir: cmd/elevator
