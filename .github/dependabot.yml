version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "src"
    labels:
      - "dependencies"
      - "python"
      - "src"

  - package-ecosystem: "uv"
    directory: "/layer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "layer"
    labels:
      - "dependencies"
      - "python"
      - "layer"

  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "terraform"
    labels:
      - "dependencies"
      - "terraform"

  - package-ecosystem: "gomod"
    directory: "/cmd/elevator"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "cmd/elevator"
    labels:
      - "dependencies"
      - "go"
      - "cli"

  # Every action in .github/workflows is now SHA-pinned (#194 C2) --
  # without this, nothing ever bumps those pinned SHAs forward, silently
  # freezing every workflow on whatever commit happened to be current when
  # each was pinned instead of picking up upstream fixes (including
  # security fixes to the actions themselves).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "github-actions"
    labels:
      - "dependencies"
      - "github-actions"
