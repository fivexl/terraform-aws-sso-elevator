version: 2
updates:
  - package-ecosystem: "poetry"
    directory: "/src"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "src"
    labels:
      - "dependencies"
      - "python"
      - "src"

  - package-ecosystem: "poetry"
    directory: "/layer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "layer"
    labels:
      - "dependencies"
      - "python"
      - "layer"

  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "terraform"
    labels:
      - "dependencies"
      - "terraform"

  - package-ecosystem: "gomod"
    directory: "/cmd/elevator"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "cmd/elevator"
    labels:
      - "dependencies"
      - "go"
      - "cli"
