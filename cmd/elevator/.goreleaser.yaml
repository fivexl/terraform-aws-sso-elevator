version: 2

before:
  hooks:
    - go -C cmd/elevator mod tidy -diff

builds:
  - main: .
    dir: cmd/elevator
    binary: elevator
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildDate={{.Date}}

# Signing is intentionally unconditional. A missing or invalid secret must
# fail the release instead of silently publishing an unsigned macOS binary.
notarize:
  macos:
    - enabled: true
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - src: cmd/elevator/README.md
        dst: README.md

checksum:
  name_template: checksums.txt

sboms:
  - id: default
    artifacts: archive

# Use the same GitHub-generated notes as the repository release rather than a
# CLI-only changelog.
changelog:
  use: github-native

homebrew_casks:
  - name: elevator
    repository:
      owner: fivexl
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/fivexl/terraform-aws-sso-elevator
    description: Submit temporary AWS access requests from the command line
    license: Apache-2.0
    binaries:
      - elevator

release:
  github:
    owner: fivexl
    name: terraform-aws-sso-elevator
  replace_existing_artifacts: true
  # Keep the release out of /releases/latest until both platform and Homebrew
  # smoke tests pass. cli-release.yml promotes it afterward.
  prerelease: true
  make_latest: false
